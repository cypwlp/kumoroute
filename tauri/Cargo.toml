[package]
name = "kumoroute"
version = "0.7.1"
description = "Lightweight Mihomo-compatible desktop client"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
sha2 = "0.10"
rfd = "0.18"
open = "5"
urlencoding = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_NetworkManagement_Rras", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
