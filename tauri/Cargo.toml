[package]
name = "myclash"
version = "0.1.0"
description = "Lightweight Clash/mihomo desktop client"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
winreg = "0.52"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
rfd = "0.14"
open = "5"
urlencoding = "2"
windows = { version = "0.58", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
