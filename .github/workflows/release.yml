name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Pin the core so tag builds are reproducible and never depend on GitHub's
  # unauthenticated API rate limit.
  MIHOMO_VERSION: v1.19.33
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_TIMEOUT: "60"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Fetch mihomo core and geodata
        run: python client/tools/fetch_core.py

      - name: Use official crates.io in CI
        run: python -c "from pathlib import Path; Path('tauri/.cargo/config.toml').unlink(missing_ok=True)"

      - name: Build (Tauri bundle)
        working-directory: tauri
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            tauri build --target universal-apple-darwin
          else
            tauri build
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python packaging/pack.py
            cp tauri/target/release/bundle/nsis/*-setup.exe dist/KumoRoute-win-x64-setup.exe
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp tauri/target/release/bundle/appimage/*.AppImage dist/KumoRoute-linux-x86_64.AppImage
            cp tauri/target/release/bundle/deb/*.deb dist/KumoRoute-linux-amd64.deb
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            cp tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/KumoRoute-macos-universal.dmg
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: kumoroute-${{ matrix.platform }}
          path: dist/KumoRoute-*
          if-no-files-found: error

  security:
    uses: ./.github/workflows/security.yml

  release:
    needs: [build, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/KumoRoute-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: KumoRoute ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
